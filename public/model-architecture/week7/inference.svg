<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1000" role="img" aria-labelledby="title desc">
<title id="title">当前推理：先选一组码，再让 WAM 生成连续动作</title><desc id="desc">已实现的固定码本链路。正式推理只使用当前信息，没有未来专家动作，也没有跨回合经验库。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9abce9"/></marker><marker id="teacher" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e0bc7e"/></marker></defs>
<rect width="1120" height="1000" rx="12" fill="#0b1422"/>
<g font-family="system-ui, Noto Sans SC, Microsoft YaHei, sans-serif">
<text x="36" y="46" font-size="29" font-weight="700" fill="#f0f4ff">当前推理：先选一组码，再让 WAM 生成连续动作</text>
<text x="36" y="82" font-size="17" fill="#b5c7df">已实现的固定码本链路。正式推理只使用当前信息，没有未来专家动作，也没有跨回合经验库。</text>
<path d="M 260,210 L 260,270" fill="none" stroke="#9abce9" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M 860,210 L 860,270" fill="none" stroke="#9abce9" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M 260,375 L 260,435" fill="none" stroke="#9abce9" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M 860,375 L 860,435" fill="none" stroke="#9abce9" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M 260,545 L 260,625" fill="none" stroke="#9abce9" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M 860,545 L 860,625" fill="none" stroke="#9abce9" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M 290,735 L 290,800" fill="none" stroke="#9abce9" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M 540,850 L 640,850" fill="none" stroke="#9abce9" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M 1080,850 L 1100,850 L 1100,165 L 1080,165" fill="none" stroke="#9abce9" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="40" y="120" width="1040" height="90" rx="9" fill="#15283f" stroke="#799bcb" stroke-width="1.6"/>
<text x="560.0" y="157.0" text-anchor="middle" font-size="21" font-weight="700" fill="#f0f4ff">当前情境 x</text>
<text x="560.0" y="187.0" text-anchor="middle" font-size="17" fill="#c5d3e7">三视角当前图像 · 语言指令 · 14 维 qpos；每次动作队列耗尽后重新读取</text>
<rect x="40" y="270" width="440" height="105" rx="9" fill="#14362f" stroke="#8ad2b7" stroke-width="1.6"/>
<text x="260.0" y="301.5" text-anchor="middle" font-size="21" font-weight="700" fill="#f0f4ff">CodePrior：按顺序采样 16 个 ID</text>
<text x="260.0" y="331.5" text-anchor="middle" font-size="17" fill="#c5d3e7">2 层自回归 Transformer · 温度 T = 1</text>
<text x="260.0" y="357.5" text-anchor="middle" font-size="17" fill="#c5d3e7">每个动作块只采样一组完整码</text>
<rect x="640" y="270" width="440" height="105" rx="9" fill="#15283f" stroke="#799bcb" stroke-width="1.6"/>
<text x="860.0" y="301.5" text-anchor="middle" font-size="21" font-weight="700" fill="#f0f4ff">父 WAM：视频条件与缓存</text>
<text x="860.0" y="331.5" text-anchor="middle" font-size="17" fill="#c5d3e7">one_pass_future_cache · 每块预填充一次</text>
<text x="860.0" y="357.5" text-anchor="middle" font-size="17" fill="#c5d3e7">原视频路径冻结；码不写入视频缓存</text>
<rect x="40" y="435" width="440" height="110" rx="9" fill="#2a2444" stroke="#b7a3ff" stroke-width="1.6"/>
<text x="260.0" y="469.0" text-anchor="middle" font-size="21" font-weight="700" fill="#f0f4ff">RVQ lookup：读取实际码向量</text>
<text x="260.0" y="499.0" text-anchor="middle" font-size="17" fill="#c5d3e7">每个位置：E₀[k₀] + E₁[k₁]</text>
<text x="260.0" y="525.0" text-anchor="middle" font-size="17" fill="#c5d3e7">8 个位置 → 8 × 128 条件向量</text>
<rect x="640" y="435" width="440" height="110" rx="9" fill="#15283f" stroke="#799bcb" stroke-width="1.6"/>
<text x="860.0" y="469.0" text-anchor="middle" font-size="21" font-weight="700" fill="#f0f4ff">Action blocks 1–9</text>
<text x="860.0" y="499.0" text-anchor="middle" font-size="17" fill="#c5d3e7">当前条件 + 带噪动作 + 去噪时刻</text>
<text x="860.0" y="525.0" text-anchor="middle" font-size="17" fill="#c5d3e7">得到 h：32 × 1024；主干权重冻结</text>
<rect x="40" y="625" width="1040" height="110" rx="9" fill="#14362f" stroke="#8ad2b7" stroke-width="1.6"/>
<text x="560.0" y="659.0" text-anchor="middle" font-size="21" font-weight="700" fill="#f0f4ff">CodeConditioner：动作 hidden 作为 Q，8 个码向量作为 K/V</text>
<text x="560.0" y="689.0" text-anchor="middle" font-size="17" fill="#c5d3e7">4-head cross-attention → 投影回 1024 → 残差相加</text>
<text x="560.0" y="715.0" text-anchor="middle" font-size="17" fill="#c5d3e7">注入 blocks[8] 之后，即第 9 个 Action block 后；没有额外 gate / alpha</text>
<rect x="40" y="800" width="500" height="100" rx="9" fill="#15283f" stroke="#799bcb" stroke-width="1.6"/>
<text x="290.0" y="829.0" text-anchor="middle" font-size="21" font-weight="700" fill="#f0f4ff">其余 Action blocks → 连续动作输出</text>
<text x="290.0" y="859.0" text-anchor="middle" font-size="17" fill="#c5d3e7">10 次去噪共享同一组码，Q 随去噪变化</text>
<text x="290.0" y="885.0" text-anchor="middle" font-size="17" fill="#c5d3e7">最终预测 32 × 14 连续关节 / 夹爪命令</text>
<rect x="640" y="800" width="440" height="100" rx="9" fill="#15283f" stroke="#799bcb" stroke-width="1.6"/>
<text x="860.0" y="829.0" text-anchor="middle" font-size="21" font-weight="700" fill="#f0f4ff">环境执行与重规划</text>
<text x="860.0" y="859.0" text-anchor="middle" font-size="17" fill="#c5d3e7">执行前 28 步，随后获取新观测</text>
<text x="860.0" y="885.0" text-anchor="middle" font-size="17" fill="#c5d3e7">下一个 chunk 重新选码；码表本身不变</text>
<text x="280" y="591" font-size="18" fill="#c4b5f4">码 K/V</text>
<text x="880" y="591" font-size="18" fill="#b4c8e1">动作 Q</text>
<text x="40" y="952" font-size="18" fill="#b4c8e1">Tokenizer 的动作重建 decoder 不参与正式输出；旧 M6 / M7 与在线码字更新均未接入。</text>
</g></svg>

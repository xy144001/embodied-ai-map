<g font-family="system-ui, Noto Sans SC, Microsoft YaHei, sans-serif">
<text x="36" y="46" font-size="29" font-weight="700" fill="#f0f4ff">路线演变：从独立选码，到配套预训练的动作策略</text>
<text x="36" y="82" font-size="17" fill="#b5c7df">三列是不同研究分支；右列为当前准备中的适配，不表示已经取得训练后的闭环结果。</text>
<path d="M 199,260 L 199,325" fill="none" stroke="#9abce9" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M 199,460 L 199,535" fill="none" stroke="#9abce9" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M 199,650 L 199,725" fill="none" stroke="#9abce9" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M 560,260 L 560,325" fill="none" stroke="#9abce9" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M 560,460 L 560,535" fill="none" stroke="#9abce9" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M 560,650 L 560,725" fill="none" stroke="#9abce9" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M 921,260 L 921,325" fill="none" stroke="#9abce9" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M 921,460 L 921,535" fill="none" stroke="#9abce9" stroke-width="2.3" marker-end="url(#arrow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1110" role="img" aria-labelledby="title desc">
<title id="title">路线演变：从独立选码，到配套预训练的动作策略</title><desc id="desc">三列是不同研究分支；右列为当前准备中的适配，不表示已经取得训练后的闭环结果。</desc>

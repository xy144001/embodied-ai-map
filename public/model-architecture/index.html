function renderModels(){
  const visible=DATA.models.slice(0,visibleModelCount);
  document.querySelector('#modelGrid').innerHTML=visible.map((m,i)=>'<button class="model" data-model="'+m.id+'" style="--model:'+m.accent+'"><small>MODEL / '+String(i+1).padStart(2,'0')+' · '+esc(m.category)+'</small><h2>'+esc(m.name)+'</h2><p>'+esc(m.subtitle)+'</p><dl><div><dt>发布时间</dt><dd>'+esc(m.releaseDate)+'</dd></div><div><dt>公司 / 机构</dt><dd>'+esc(m.organization)+'</dd></div><div><dt>规模</dt><dd>'+esc(m.parameters)+'</dd></div></dl><p>'+esc(m.summary)+'</p><em>查看完整技术档案 →</em></button>').join('');
  document.querySelectorAll('.model').forEach(b=>b.onclick=()=>openModelWithDiagram(b.dataset.model));
  const more=document.querySelector('#modelMore');
  more.hidden=visibleModelCount>=DATA.models.length;
  more.textContent='加载更多模型（'+Math.min(visibleModelCount,DATA.models.length)+' / '+DATA.models.length+'）';
}
document.querySelector('#modelMore').onclick=()=>{visibleModelCount+=MODEL_BATCH_SIZE;renderModels()};
function modelDiagram(m){const lane=(label,title,nodes)=>'<div class="d-lane"><div class="d-label"><b>'+label+'</b><span>'+title+'</span></div><div class="d-flow">'+nodes.map((x,i)=>'<div class="d-step"><div><small>0'+(i+1)+'</small><p>'+esc(x)+'</p></div>'+(i<nodes.length-1?'<i>→</i>':'')+'</div>').join('')+'</div></div>';const stages=m.detailedFlow.map((stage,i)=>'<div class="df-stage"><div class="df-rail"><b>'+String(i+1).padStart(2,'0')+'</b><span>'+esc(stage.title)+'</span></div><div class="df-nodes" style="--cols:'+stage.nodes.length+'">'+stage.nodes.map(n=>'<div class="df-node"><b>'+esc(n.title)+'</b><p>'+esc(n.detail)+'</p></div>').join('')+'</div>'+(i<m.detailedFlow.length-1?'<div class="df-arrow">▼</div>':'')+'</div>').join('');return '<section class="section"><div class="kicker">01 · 模型流程图</div><div class="diagram">'+lane('TRAIN','训练路径',m.diagram.training)+lane('RUN','推理路径',m.diagram.inference)+'<div class="d-feedback"><b>↺ CLOSED LOOP</b>'+esc(m.diagram.feedback)+'</div></div><button class="df-toggle" onclick="toggleDetailed(this)">展开模块级详细执行流程 →</button><div class="df-detail"><div class="df-head">MODULE-LEVEL EXECUTION GRAPH</div>'+stages+'</div></section>'}
function toggleDetailed(button){const panel=button.nextElementSibling,open=panel.classList.toggle('open');button.textContent=open?'收起模块级执行流程 ↑':'展开模块级详细执行流程 →'}
const modelCache=new Map(),modelResolvers=new Map();
window.__MODEL_DETAIL_LOADED__=m=>{modelCache.set(m.id,m);const pending=modelResolvers.get(m.id);if(pending){pending.resolve(m);modelResolvers.delete(m.id)}};
function loadModel(id){
  if(modelCache.has(id))return Promise.resolve(modelCache.get(id));
  if(modelResolvers.has(id))return modelResolvers.get(id).promise;
  let resolve,reject;const promise=new Promise((ok,fail)=>{resolve=ok;reject=fail});
  modelResolvers.set(id,{promise,resolve,reject});
  const script=document.createElement('script');script.src='./models/'+encodeURIComponent(id)+'.js';script.async=true;
  script.onerror=()=>{modelResolvers.delete(id);reject(new Error('模型详情加载失败'))};document.head.appendChild(script);
  return promise;
}
async function openModelWithDiagram(id){
  const meta=DATA.models.find(x=>x.id===id);if(!meta)return;
  document.documentElement.style.setProperty('--accent',meta.accent);document.querySelector('#crumb').textContent=meta.category;document.querySelector('#title').textContent=meta.name;document.querySelector('#subtitle').textContent=meta.subtitle;
  document.querySelector('#detail').innerHTML='<div class="model-loading">正在加载 '+esc(meta.name)+' 的技术档案…</div>';document.querySelector('#modal').classList.add('open');document.querySelector('.dialog').scrollTop=0;document.body.style.overflow='hidden';
  try{const m=await loadModel(id);openModel(m);const first=document.querySelector('#detail .section');first.insertAdjacentHTML('afterend',modelDiagram(m))}catch(error){document.querySelector('#detail').innerHTML='<div class="model-error">详情加载失败。请检查网络连接后返回并重试。<br>'+esc(error.message)+'</div>'}
}
function openModel(m){document.documentElement.style.setProperty('--accent',m.accent);document.querySelector('#crumb').textContent=m.category;document.querySelector('#title').textContent=m.name;document.querySelector('#subtitle').textContent=m.subtitle;const facts='<div class="model-facts"><div><b>发布时间</b><span>'+esc(m.releaseDate)+'</span></div><div><b>公司 / 机构</b><span>'+esc(m.organization)+'</span></div><div><b>规模</b><span>'+esc(m.parameters)+'</span></div></div>';document.querySelector('#detail').innerHTML='<section class="section"><div class="kicker">00 · 模型概览</div><div class="lead">'+esc(m.summary)+'</div>'+facts+'</section><section class="section"><div class="kicker">01 · 技术路线</div><div class="model-route">'+m.route.map((x,i)=>'<article><b>0'+(i+1)+'</b><p>'+esc(x)+'</p></article>').join('')+'</div></section><section class="section"><div class="kicker">02 · 架构与技术细节</div><ol class="points">'+m.architecture.map((x,i)=>'<li><b>0'+(i+1)+'</b><span>'+esc(x)+'</span></li>').join('')+'</ol></section><section class="section"><div class="kicker">03 · 关键公式</div><div class="math-stack">'+m.formulaHtml.map(x=>'<div class="math-display">'+x+'</div>').join('')+'</div><ul class="notes">'+m.formulaNotes.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></section><section class="section"><div class="kicker">04 · 训练方法</div>'+list(m.training,'uses')+'</section><section class="section"><div class="kicker">05 · 推理与闭环控制</div><div class="flow">'+m.inference.map((x,i)=>'<div class="step"><span>'+(i+1)+'</span><p>'+esc(x)+'</p>'+(i<m.inference.length-1?'<i>→</i>':'')+'</div>').join('')+'</div></section><section class="section"><div class="kicker">06 · 深入辨析</div><div class="deep">'+m.deepDive.map((x,i)=>'<article><b>0'+(i+1)+'</b><p>'+esc(x)+'</p></article>').join('')+'</div></section><section class="section pitfall-box"><div class="kicker">07 · 常见误区与工程注意</div>'+list(m.pitfalls,'pitfalls')+'</section><section class="section"><div class="kicker">08 · 官方资料</div><div class="sources">'+m.sources.map(x=>'<a target="_blank" rel="noreferrer" href="'+x.url+'">'+esc(x.label)+' ↗</a>').join('')+'</div></section>';document.querySelector('#modal').classList.add('open');document.querySelector('.dialog').scrollTop=0;document.body.style.overflow='hidden'}
function setMode(mode){const theory=mode==='theory';document.querySelector('#theoryView').style.display=theory?'block':'none';document.querySelector('.tools').style.display=theory?'flex':'none';document.querySelector('#modelsView').classList.toggle('open',!theory);document.querySelector('#theoryBtn').classList.toggle('active',theory);document.querySelector('#modelsBtn').classList.toggle('active',!theory)}
function close(){document.querySelector('#modal').classList.remove('open');document.body.style.overflow=''}document.querySelector('#close').onclick=close;document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});document.querySelector('#search').oninput=render;document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{active=b.dataset.track;document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelector('#theoryBtn').onclick=()=>setMode('theory');document.querySelector('#modelsBtn').onclick=()=>setMode('models');render();renderModels();setMode('models');</script></body></html>

,{"label":"论文","url":"https://arxiv.org/abs/2504.16054"},{"label":"openpi","url":"https://github.com/Physical-Intelligence/openpi"}],"route":["视觉图像被切成 patch token，语言指令被编码为文本 token；机器人的本体状态会被离散化并作为额外文本式 token 注入上下文。","语义主干先融合视觉、语言和状态。模型能够自回归生成高层文本或子任务 token，例如先判断当前场景处于哪一步。","独立的连续动作专家接收上下文、带噪动作块和 Flow Matching 时间变量；图像、文本、状态与动作 token 之间采用双向注意力交换信息。","动作专家预测速度场并经过少量数值积分/去噪步骤得到一段连续动作；真实机器人只执行其中一个短窗口，然后用新观测再次推理。"],"architecture":["异构联合训练：机器人轨迹、跨本体数据、高层语义预测、网页多模态数据共同训练。它的关键不是把所有数据变成同一种标签，而是让共享主干同时学习语义知识和物理控制。","双动作目标：预训练阶段可使用 FAST 将连续动作压缩为离散 token 做自回归学习；后训练阶段加入连续 Flow Matching 动作专家，避免量化精度上限。","动作块：一次输出未来若干控制步，提升轨迹连贯性并降低推理频率。动作块不是开环执行到底，系统仍按滚动时域用真实观测纠偏。","高层—低层耦合：文本解码给出子任务或语义中间结果，连续动作头负责精确控制。这解释了为什么 π₀.₅ 既能利用互联网语义知识，又不必把每个关节值硬塞进语言词表。"],"formulas":["a^{\\tau}=\\tau a+(1-\\tau)\\epsilon,\\qquad \\epsilon\\sim\\mathcal{N}(0,I)","v^{*}(a^{\\tau},\\tau)=a-\\epsilon,\\qquad \\mathcal{L}_{\\mathrm{flow}}=\\mathbb{E}\\left[\\lVert v_{\\theta}(a^{\\tau},o,l,s,\\tau)-v^{*}\\rVert_2^2\\right]","a_{k+1}=a_k+\\Delta\\tau\\,v_{\\theta}(a_k,o,l,s,\\tau_k)"],"formulaNotes":["第一式在真实动作 a 与高斯噪声 ε 之间建立一条概率路径；论文之间可能把时间端点写反，但含义相同。","模型学习的不是最终动作本身，而是路径上每一点应沿哪个速度方向移动。推理时对速度场积分，噪声就被运输为动作块。","时间 τ 通常先做正弦/Fourier 编码，再经 MLP 投影到隐藏维度；‘正弦编码’和‘MLP 时间嵌入’不是两条互斥方案。"],"training":["预训练让视觉语言主干获得跨场景语义能力，并用大规模异构机器人数据学习跨本体共同结构。","高层输出使用自回归交叉熵；连续动作使用条件 Flow Matching。训练时两类目标可按数据类型和阶段组合。","后训练加入包含自然语言中间步骤的示例，让模型在陌生环境中先形成高层判断，再输出低层动作。"],"inference":["读取当前多相机图像、指令与本体状态。","生成必要的高层文本/子任务 token。","从高斯动作噪声出发，运行约 10 个 Flow Matching 积分步得到动作块。","只执行短动作段；获得新的真实观测后重新规划。"],"deepDive":["为什么同时保留 FAST 与连续专家：FAST 让动作进入语言模型熟悉的自回归训练范式，适合大规模预训练；连续专家则保留精细控制分辨率并减少离散量化误差。","它不是显式视频世界模型：π₀.₅ 学到的表示可以含有动力学知识，但推理时不先生成未来视频再从视频反推动作。","同步动作块会产生推理等待。后续系统可用实时动作分块技术让新旧动作平滑交接，但这属于执行系统层，而不是改变模型的 Flow Matching 目标。"],"pitfalls":["不要把 Flow Matching 的时间 τ 当作机器人真实时间步；它是生成路径上的噪声时间。","不要把动作块等同于长期开环控制。稳定部署依赖新观测、重规划和动作块衔接。","openpi 开源了 π 系列实现与部分权重，但 π₀.₅ 的全部训练数据和生产系统并未完整开放。"],"formulaHtml":["<span class=\"katex-display\"><span class=\"katex\"><span class=\" ><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mord mathnormal\">s</span><span class=\"mpunct\">,</span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.1132em;\">τ</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3361em;\"><span style=\"top:-2.55em;margin-left:-0.1132em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mathnormal mtight\" style=\"margin-right:0.03148em;\">k</span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span><span class=\"mclose\">)</span></span></span></span></span>"]},{"id":"xvla","name":"X‑VLA 0.9B","subtitle":"用软提示扩展跨本体策略","organization":"清华大学 AIR / 2toINF 团队","releaseDate":"2025-10-11","category":"VLA · Soft Prompt · Flow Matching","parameters":"约 0.9B","accent":"#b49cff","summary":"X‑VLA 的核心问题是：同一个策略怎样同时容纳不同机器人、相机布局和动作维度。它用极少量本体专属参数吸收差异，其余 Transformer 权重保持共享。","diagram":{"training":["7 个跨本体数据源","本体 Soft Prompt","输入投影 + Florence 编码","24 层共享 Transformer","Flow Matching 损失"],"inference":["选择机器人接口","主视角 + 腕部视角 + 状态","Prompt 条件共享控制器","本体专属输出投影","连续动作块"],"feedback":"执行后读取该本体的新观测，再次通过同一共享策略"},"detailedFlow":[{"title":"本体选择","nodes":[{"title":"Embodiment ID e","detail":"选择数据域 / 机器人对应接口"},{"title":"Soft Prompt Pₑ","detail":"连续可学习的机器人身份 token"}]},{"title":"视觉语言输入","nodes":[{"title":"Main-view RGB","detail":"进入完整 Florence-Large VLM"},{"title":"Wrist-view RGB","detail":"只经过视觉编码器，减少重复计算"},{"title":"Language","detail":"任务指令文本 token"}]},{"title":"控制条件","nodes":[{"title":"Proprio State","detail":"经本体专属输入投影"},{"title":"Noisy Action Chunk","detail":"连续 Flow 路径上的动作样本"},{"title":"Time τ","detail":"sinusoidal / Fourier 特征再经 MLP"}]},{"title":"统一控制 token","nodes":[{"title":"Projection Wₑ","detail":"把不同状态/动作维度投影到 1024 hidden"},{"title":"Multimodal Tokens","detail":"Soft Prompt + 图像 + 语言 + 控制 token 拼接"}]},{"title":"共享策略主体","nodes":[{"title":"Standard Transformer ×24","detail":"hidden 1024；所有 token 做双向自注意力；大部分权重跨本体共享"}]},{"title":"本体输出接口","nodes":[{"title":"Control Hidden","detail":"抽取动作位置的共享表示"},{"title":"Output Projection Oₑ","detail":"映射回该机器人原始动作维度"}]},{"title":"Flow 生成","nodes":[{"title":"Velocity Field","detail":"预测 a−ε 方向"},{"title":"ODE Integration","detail":"迭代更新整段连续动作"}]},{"title":"部署闭环","nodes":[{"title":"Robot-specific Action","detail":"反归一化并发送控制器"},{"title":"New Observation","detail":"保留 Pₑ 与接口，刷新视觉和状态"}]}],"sources":[{"label":"论文","url":"https://arxiv.org/abs/2510.10274"},{"label":"代码仓库","url":"https://github.com/2toinf/X-VLA"}],"route":["主视角图像和语言经过 Florence-Large 视觉语言编码器；腕部等附加视角只走视觉编码器，以控制 token 数和计算量。","每个数据源/机器人分配一组可学习 Soft Prompt；本体状态、Flow 时间与带噪动作块被投影成控制 token。","Soft Prompt、多模态 token 与控制 token 进入 24 层、隐藏维 1024 的标准双向 Transformer。","本体专属输出投影把共享控制表示映射回该机器人的动作维度，Flow Matching 积分生成连续动作块。"],"architecture":["共享主体：绝大多数参数被所有机器人共享，学习抓取、接触、目标对齐等可迁移结构。","本体接口：Soft Prompt 告诉共享网络‘当前是哪一种身体/数据域’，输入投影处理不同状态维度，输出投影处理不同动作维度。三者合计仅占很小参数比例。","标准 Transformer 而非额外大动作专家：动作 token 与视觉语言 token 在同一组双向自注意力层里交互，结构更直接。","多视角非对称编码：主视角承担完整语义融合，附加视角复用视觉编码，避免每个相机都重复运行完整 VLM。"],"formulas":["X_0=[P_e;V(o);T(l);W_e(s,a^{\\tau},\\gamma(\\tau))]","X_{k+1}=\\mathrm{TransformerBlock}_k(X_k),\\qquad k=0,\\ldots,23","\\hat v_e=O_e(X_{24}^{\\mathrm{ctrl}}),\\qquad \\mathcal{L}=\\mathbb{E}\\lVert\\hat v_e-(a-\\epsilon)\\rVert_2^2"],"formulaNotes":["P_e 是第 e 种机器人/数据域的软提示；W_e、O_e 是本体专属的输入和输出投影。","γ(τ) 表示正弦/Fourier 时间编码。它先把一个标量展开为多频特征，再由线性层或 MLP 对齐到控制 token 维度。","网络主体不需要为每台机器人复制；新增本体时重点学习接口参数与软提示。"],"training":["论文汇集约 29 万条、来自 7 个来源的跨本体轨迹，让共享网络看到不同机械臂、视角和数据分布。","训练时根据样本来源选择对应 Soft Prompt 和输入/输出投影，主体参数由所有来源共同更新。","动作目标采用连续 Flow Matching；语言和视觉编码器提供任务语义与目标物体表征。"],"inference":["选择目标机器人对应的 Soft Prompt 与接口投影。","编码主视角、附加视角、指令和本体状态。","将带噪动作块与时间编码送入共享 Transformer。","通过本体专属输出层和 Flow 积分得到该机器人的动作。"],"deepDive":["Soft Prompt 不只是文字前缀：它是可训练的连续向量，参与每层注意力，长期充当机器人身份、相机/控制约定和数据域的条件。","为什么时间既有 sinusoidal 又有 MLP：正弦基提供不同频率与平滑外推，MLP 学习当前网络真正需要的非线性组合。前者是基函数，后者是适配器。","0.9B 的紧凑规模并不意味着没有跨模态能力；它把容量集中在共享控制 Transformer，并把本体差异限制在很小的参数接口中。"],"pitfalls":["Soft Prompt 能缓解本体冲突，但不能自动解决坐标系、动作归一化和控制频率不一致；数据预处理仍决定上限。","新增机器人只训练接口参数是一种高效适配思路，不代表任何零样本机器人都能直接工作。","附加视角只走视觉编码器是计算权衡，不表示腕部视角不重要。"],"formulaHtml":["<span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>X</mi><mn>0</mn></msub><mo>=</mo><mo stretchy=\"false\">[</mo><msub><mi>P</mi><mi>e</mi></msub><mo separator=\"true\">;</mo><mi>V</mi><mo stretchy=\"false\">(</mo><mi>o</mi><mo stretchy=\"false\">)</mo><mo separator=\"true\">;</mo><mi>T</mi><mo stretchy=\"false\">(</mo><mi>l</mi><mo stretchy=\"false\">)</mo><mo separator=\"true\">;</mo><msub><mi>W</mi><mi>e</mi></msub><mo stretchy=\"false\">(</mo><mi>s</mi><mo separator=\"true\">,</mo><msup><mi>a</mi><mi>τ</mi></msup><mo separator=\"true\">,</mo><mi>γ</mi><mo stretchy=\"false\">(</mo><mi>τ</mi><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">]</mo></mrow><annotation encoding=\"application/x-tex\">X_0=[P_e;V(o);T(l);W_e(s,a^{\\tau},\\gamma(\\tau))]</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.8333em;vertical-align:-0.15em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.07847em;\">X</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3011em;\"><span style=\"top:-2.55em;margin-left:-0.0785em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\">0</span></span></span></span><span cl pStack Features","detail":"抽取多层视觉特征并送入 Qwen3-VL Prefix"}]},{"title":"三路表征","nodes":[{"title":"Image / Text Tokens","detail":"语义上下文"},{"title":"Current Query","detail":"学习当前几何与时序表征"},{"title":"Future Query","detail":"学习 t+T 的未来提示表征"}]},{"title":"双教师蒸馏（仅训练）","nodes":[{"title":"LingBot-Depth Teacher","detail":"当前与未来深度特征 → L1 geometry loss"},{"title":"DINO-Video Teacher","detail":"当前与未来时序语义 → Frobenius future loss"}]},{"title":"动作条件投影","nodes":[{"title":"Current State 55D → 768D","detail":"canonical state mask 后线性投影"},{"title":"Noisy Action 55D → 768D","detail":"动作块每个 token 投影"},{"title":"Flow Time → 768D","detail":"时间编码经 MLP 并加到动作 token"}]},{"title":"联合注意力","nodes":[{"title":"Action Expert ×36","detail":"768 hidden；动作 token 读取 image / text / current / future query 上下文"}]},{"title":"稀疏 FFN","nodes":[{"title":"Joint Attention","detail":"跨模态信息路由"},{"title":"MoE FFN","detail":"32 routed experts，Top-4 激活 + 1 shared expert；SwiGLU"}]},{"title":"速度场输出","nodes":[{"title":"Action Hidden 768","detail":"每个动作 token 的最终表示"},{"title":"Linear 768 → 55","detail":"输出 canonical action velocity"}]},{"title":"积分与执行","nodes":[{"title":"Euler × N","detail":"沿 Flow velocity 更新 55D 动作块"},{"title":"55D Action Chunk","detail":"按本体 mask 取有效维并反归一化"}]},{"title":"真实观测刷新","nodes":[{"title":"Observation t+1","detail":"重新计算两种 Query；Future Query_t 不会变成 Current Query_{t+1}"}]}],"sources":[{"label":"官方页面","url":"https://technology.robbyant.com/lingbot-vla-v2"},{"label":"论文","url":"https://arxiv.org/abs/2607.06403"},{"label":"代码仓库","url":"https://github.com/Robbyant/lingbot-vla-v2"}],"route":["多视角观测、指令与统一后的本体状态进入 Qwen3-VL 语义主干；不同机器人动作被整理到 55 维 canonical state/action 空间。","两个独立可学习槽位 Q_t 与 Q_{t+T} 追加到视觉语言 token：前者表示当前，后者学习动作块末端时刻的未来表征。","Current/Future Query 分别蒸馏当前/未来的深度特征和 DINO-Video 时序语义特征；动作专家则在同一上下文上预测连续动作块。","动作专家把每个 FFN 替换为稀疏 MoE：共享专家始终启用，路由专家只激活 Top-K，最后通过连续生成目标输出动作。"],"architecture":["55D 统一动作空间：包含双臂关节、双末端位姿、夹爪、灵巧手、腰部、头部、移动底盘和保留维度；配合 mask 让不同本体只使用相关维。","细粒度稀疏 MoE：共享专家承载跨机器人共性，路由专家吸收任务/本体差异。SwiGLU 提供非线性，Top-K 激活控制每个 token 的计算量。","无辅助损失负载均衡：选择专家时加入校正偏置，实际融合权重仍使用未加偏的 affinity，减少专家塌缩又不直接扭曲主任务梯度。","双查询蒸馏：深度教师提供几何，DINO-Video 提供跨帧时序语义。未来查询的监督来自真实未来帧的教师特征。"],"formulas":["[h_t,h_{t+T}]=F_{\\theta}([V(o_t);T(l);Q_t;Q_{t+T}])","\\mathcal{L}_{q}=\\lambda_d(\\lVert h_t^d-d_t\\rVert_1+\\lVert h_{t+T}^d-d_{t+T}\\rVert_1)+\\lambda_s(\\lVert h_t^s-s_t\\rVert_F^2+\\lVert h_{t+T}^s-s_{t+T}\\rVert_F^2)","y=E_{\\mathrm{shared}}(x)+\\sum_{i\\in\\mathrm{TopK}(r(x)+b)}\\frac{r_i(x)}{\\sum_{j\\in K}r_j(x)}E_i(x)"],"formulaNotes":["Q_t 与 Q_{t+T} 是两组不同的可学习参数槽位，不是同一个向量沿时间递推。每次推理都会基于新的真实观测重新计算它们。","未来 Query 在训练时看的是由真实未来帧提取的教师目标，但学生输入仍是当前观测和指令，因此它学习‘从当前条件预测未来表征’。","代码里类似 1024→8×256 的写法应理解为把宽 FFN 容量拆成 8 个窄专家：每个专家从 1024 维输入映射到 256 维中间特征，路由器只选其中一部分；它不是简单 reshape。"],"training":["数据规模约 6 万小时，其中包含跨 20 种机器人配置的轨迹以及大规模第一视角人类视频。","DINO-Video 以 DINOv3 初始化，引入分块因果时间注意力和 3D RoPE，从视频中提取动作进展相关的教师特征。","总目标联合动作生成、深度蒸馏和时序语义蒸馏；Future Query 的标签来自相隔一个动作块的真实未来观测。"],"inference":["读取时刻 t 的真实图像、指令和本体状态。","同时计算 Current Query、Future Query 与动作 token；不需要输入真实未来帧。","稀疏 MoE 动作专家生成动作块。","执行短动作段，到 t+1 读取新的真实观测并全部重算。"],"deepDive":["Future Query 不是 FutureQuery_t→CurrentQuery_{t+1}：两者没有这样的参数复制或隐状态传递。它们是固定角色的查询槽位，在每次真实观测上重新前向计算。","它也不是动作条件世界模型：未来表征主要由当前视觉、语言和任务条件预测，并未显式给定候选动作后递归模拟结果。因此更准确的叫法是‘面向未来的辅助表征’。","真实观测刷新会截断预测误差积累：即使 Future Query 有偏差，下一次前向仍从真实相机画面开始。这与自由滚动生成多帧未来的 WAM 有本质差异。"],"pitfalls":["不要把双 Query 画成循环 RNN；论文结构是同一次前向中的两个监督槽位。","‘预测未来特征’不等于‘生成未来视频’，也不自动具备对不同候选动作做因果模拟的能力。","55D canonical vector 只是统一接口；正确的维度 mask、坐标规范和归一化仍是跨本体训练的核心工程。"],"formulaHtml":["<span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mo stretchy=\"false\">[</mo><msub><mi>h</mi><mi>t</mi></msub><mo separator=\"true\">,</mo><msub><mi>h</mi><mrow><mi>t</mi><mo>+</mo><mi>T</mi></mrow></msub><mo stretchy=\"false\">]</mo><mo>=</mo><msub><mi>F</mi><mi>θ</mi></msub><mo stretchy=\"false\">(</mo><mo stretchy=\"false\">[</mo><mi>V</mi><mo stretchy=\ "detail":"对每层稠密视频 token 做 cross-attention pooling"},{"title":"Average + LayerNorm","detail":"每层压成固定大小状态 sℓ"}]},{"title":"多层融合","nodes":[{"title":"Per-layer Projection","detail":"把不同层状态对齐"},{"title":"State Fusion","detail":"拼接浅层几何和深层语义形成 h"}]},{"title":"直接动作专家","nodes":[{"title":"h + Action-step Embedding eₖ","detail":"为动作块中每个位置提供次序"},{"title":"StateFusionActionExpert","detail":"约 351M 参数；不做动作扩散/Flow 去噪"}]},{"title":"单次解码","nodes":[{"title":"Output Head","detail":"一次前向同时预测全部动作步"},{"title":"Action Chunk","detail":"约 72 ms 论文测量条件下输出"}]},{"title":"部署闭环","nodes":[{"title":"Video Branch OFF","detail":"推理不生成未来视频"},{"title":"New RGB Observation","detail":"重新提取特征并直接预测下一动作块"}]}],"sources":[{"label":"论文","url":"https://arxiv.org/abs/2606.08242"},{"label":"代码仓库","url":"https://github.com/L1ziang/Light-WAM"}],"route":["冻结 Wan2.1-T2V-1.3B 视频骨干和 VAE，只在注意力/FFN 中训练 LoRA，并在少数深度插入轻量 WAM bottleneck adapter。","训练视频分支把未来视频压到空间下采样的 VAE 潜空间，用 Flow Matching 学习未来潜视频；文本与本体状态作为条件。","动作分支只使用原分辨率的当前观测 latent，并从多个选定层读取适配后的隐藏状态。","StateFusionActionExpert 用学习查询压缩每层稠密视频 token，融合多层状态，再对每个动作步加入位置嵌入并一次前向输出动作块。"],"architecture":["冻结视频先验：Wan 骨干保留已有运动与视觉知识；LoRA 负责广泛但低秩的适配，少量 WAM adapter 在关键层提供机器人域容量。","降采样未来监督：未来视频目标只在更小潜空间计算，显著减少时空 token 与训练显存，但仍迫使表示编码物体运动和任务进度。","Learned-query pooling：每层使用少量查询对全部视频 token 做注意力汇聚，从 N 个稠密 token 压成一个状态向量，再融合浅层几何与深层语义。","直接动作头：没有动作扩散/Flow 的迭代去噪。动作专家约 351M，整套可训练参数约 0.44B。"],"formulas":["\\hat A=\\pi_{\\phi}(h_{\\theta}(o,l,p))","s_{\\ell}=\\mathrm{LN}\\left(\\frac{1}{N_q}\\sum_{j=1}^{N_q}\\mathrm{Attn}(q_{\\ell,j},H_{\\ell},H_{\\ell})\\right)","h=\\mathrm{Fuse}([P_{\\ell_1}s_{\\ell_1};\\cdots;P_{\\ell_m}s_{\\ell_m}]),\\qquad \\hat a_k=W_o(h+e_k)"],"formulaNotes":["hθ 是经过适配的视频骨干多层表示，πφ 是直接动作解码器；部署时只需要这条路径。","查询瓶颈把大量空间—时间 token 压成固定大小状态，避免动作头对所有 token 做昂贵的深层生成计算。","e_k 是动作块内第 k 步的位置嵌入，使同一个融合状态能输出一串次序不同的动作。"],"training":["未来视频分支采用条件 Flow Matching，但只作为训练期辅助目标；动作分支用示范动作监督。","原始视频骨干与 VAE 冻结，可训练部分由 LoRA、少量 adapter 和动作专家构成。","论文报告 LIBERO 平均成功率 97.2%、RoboTwin 2.0 平均 76.4%，推理延迟约 72.03 ms、峰值显存约 4.1 GiB。"],"inference":["VAE 编码当前观测，不生成未来视频。","适配后的 Wan 骨干提取多个层级的当前状态。","学习查询汇聚并融合多层状态。","一次前向直接输出完整动作块，再用下一帧真实观测闭环重算。"],"deepDive":["为什么仍叫 WAM：世界预测是训练目标的一部分，它塑造共享视觉表示；是否在推理时显式 rollout 并不是 WAM 的唯一判据。","Light‑WAM 的关键判断是：未来视频最有价值的部分可能是训练信号，而不是部署时真的渲染未来帧。这样牺牲显式想象能力，换取实时性。","与 LingBot‑VA 相比，它不能在推理时展示‘预测的未来视觉’，也不能直接比较多个想象轨迹；优势是单次动作解码和较低显存。"],"pitfalls":["训练时存在视频 Flow Matching，不代表动作推理也需要迭代去噪。两条分支的生成方式不同。","推理只输入当前观测 latent；不能把训练时的真实未来 latent 泄漏到部署描述中。","论文的 72 ms 是特定硬件与实现条件下的测量，迁移到自己的相机、精度和 GPU 后需重新 profiling。"],"formulaHtml":["<span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mover accent=\"true\"><mi>A</mi><mo>^</mo></mover><mo>=</mo><msub><mi>π</mi><mi>ϕ</mi></msub><mo stretchy=\"false\">(</mo><msub><mi>h</mi><mi>θ</mi></msub><mo stretchy=\"false\">(</mo><mi>o</mi><mo separator=\"true\">,</mo><mi>l</mi><mo separator=\"true\">,</mo><mi>p</mi><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\hat A=\\pi_{\\phi}(h_{\\theta}(o,l,p))</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.9468em;\"></span><span class=\"mord accent\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.9468em;\"><span style=\"top:-3em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord mathnormal\">A</span></span><span style=\"top:-3.2523em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"accent-body\" style=\"left:-0.1111em;\"><span class=\"mord\">^</span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:1.0361em;vertical-align:-0.2861em n","detail":"执行对应视觉间隔的动作"}]},{"title":"自回归闭环","nodes":[{"title":"Persistent KV Cache","detail":"保留历史而非重复全量计算"},{"title":"Inject New Real Observation","detail":"每个闭环周期纠正预测未来，不是首帧自由滚动"}]}],"sources":[{"label":"论文","url":"https://arxiv.org/abs/2601.21998"},{"label":"代码仓库","url":"https://github.com/Robbyant/lingbot-va"}],"route":["Wan2.2-5B 初始化宽视频流；结构深度相同但隐藏维更窄的动作流专门处理机器人动作。","视频潜变量与动作按时间交错排列：[z_t,a_{t,1},…,a_{t,τ},z_{t+1},…]。时间压缩率 τ=4，因此每生成一个视频 latent 间隔就对应 4 个动作。","Mixture-of-Transformers 为视频和动作保留独立 FFN/QKV 参数，但把动作表示投影到视频维后做联合注意力，使两种模态互相读取。","模型先用条件 Flow Matching 生成未来视觉转移，再由动作流从当前与预测未来之间的变化推断动作；多段结果以自回归方式继续。"],"architecture":["双流非对称容量：视频生成需要大容量，动作维度较低，因此动作流保持相同层数但更窄，减少参数和计算。","交错因果序列：视觉状态和其间动作在同一时间轴上排列，因果注意力只读取历史，天然支持可变长度 rollout。","联合注意力：视频/动作各自做投影和 FFN，但注意力空间相通。动作能读取视觉变化，视频也能利用动作历史。","KV Cache：保留历史 token 的键值，避免每次自回归生成从头计算，同时给策略提供长期上下文。"],"formulas":["S=[z_t,a_{t,1},\\ldots,a_{t,\\tau},z_{t+1},a_{t+1,1},\\ldots],\\qquad \\tau=4","z_{t+1}\\sim p_{\\theta}(z\\mid z_{\\le t},a_{<t+1},l),\\qquad a_t\\sim g_{\\phi}(z_t,z_{t+1},l)","\\mathcal{L}=\\mathcal{L}_{\\mathrm{video-flow}}+\\lambda_a\\mathcal{L}_{\\mathrm{action}}"],"formulaNotes":["第一式把世界状态与造成转移的动作绑定在同一因果序列里。预测 K 个视频帧间隔时，会同时产生 τK 个动作。","第二式表达‘先建模视觉动力学，再从视觉转移推断动作’的结构化分工；实际网络通过双流联合注意力端到端耦合。","视频支路的 Flow Matching 时间仍是生成噪声时间，不是交错序列的物理时间索引。"],"training":["第一阶段强化未来视觉动力学，让视频流学会从历史观测预测接下来可见的状态变化。","第二阶段加入逆动力学/动作学习，使动作流从当前—未来视觉关系恢复机器人控制。","训练使用交错序列的 teacher forcing；可变 chunk K∈[1,8] 让模型适应不同规划范围，部署常用 K=4。"],"inference":["注入最新真实观测与历史 KV Cache。","视频流生成下一段未来视觉 latent，动作流同步读取视觉转移。","解码并执行对应动作块；异步系统可让预测与电机执行并行。","下一个闭环周期再次注入真实观测，校正缓存上下文后继续自回归。"],"deepDive":["它比 LingBot‑VLA2 更接近完整 WAM：未来分支在推理时实际运行，并且动作显式依赖预测的视觉转移，而不是只用一个辅助 Future Query。","但它也不是‘只看第一帧后永远自由生成’：部署会持续接收真实相机观测。自回归指模型保持历史和生成结构，不等于拒绝现实反馈。","真实观测能周期性纠偏，但在每个 chunk 内仍可能发生世界预测误差；K 越长，前瞻更远、延迟摊销更好，误差累积风险也更高。"],"pitfalls":["不要把 autoregressive 理解成完全开环。闭环 WAM 可以既自回归维护历史，又不断插入真实观测。","动作由预测视觉转移驱动，因此世界模型偏差会直接影响控制；必须权衡 rollout 长度、去噪步数和控制频率。","KV Cache 保存的是 Transformer 历史计算，不是物理世界的绝对真值；真实观测刷新和缓存管理同样重要。"],"formulaHtml":["<span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>S</mi><mo>=</mo><mo stretchy=\"false\">[</mo><msub><mi>z</mi><mi>t</mi></msub><mo separator=\"true\">,</mo><msub><mi>a</mi><mrow><mi>t</mi><mo separator=\"true\">,</mo><mn>1</mn></mrow></msub><mo separator=\"true\">,</mo><mo>…</mo><mo separator=\"true\">,</mo><msub><mi>a</mi><mrow><mi>t</mi><mo separator=\"true\">,</mo><mi>τ</mi></mrow></msub><mo separator=\"true\">,</mo><msub><mi>z</mi><mrow><mi>t</mi><mo>+</mo><mn>1</mn></mrow></msub><mo separator=\"true\">,</mo><msub><mi>a</mi><mrow><mi>t</mi><mo>+</mo><mn>1</mn><mo separator=\"true\">,</mo><mn>1</mn></mrow></msub><mo separator=\"true\">,</mo><mo>…</mo><mo stretchy=\"false\">]</mo><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>τ</mi><mo>=</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">S=[z_t,a_{t,1},\\ldots,a_{t,\\tau},z_{t+1},a_{t+1,1},\\ldots],\\qquad \\tau=4</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.05764em;\">S</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:1.0361em;vertical-align:-0.2861em;\"></span><span class=\"mopen\">[</span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.04398em;\">z</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.2806em;\"><span style=\"top:-2.55em;margin-left:-0.044em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class= function render(){const q=document.querySelector('#search').value.trim().toLowerCase();const root=document.querySelector('#tracks');root.innerHTML='';let total=0;Object.entries(DATA.trackMeta).forEach(([id,t])=>{if(active!=='all'&&active!==id)return;const nodes=DATA.topics.filter(x=>x.track===id&&(!q||JSON.stringify(x).toLowerCase().includes(q)));if(!nodes.length)return;total+=nodes.length;const art=document.createElement('section');art.className='track';art.style.setProperty('--track',t.accent);art.innerHTML='<div class="track-head"><small>'+t.index+' · '+esc(t.label)+'</small><h2>'+esc(t.title)+'</h2><p>从左向右学习，点击节点进入详细技术讲解。</p></div><div class="nodes">'+nodes.map((n,i)=>'<button class="node" data-id="'+n.id+'"><small>'+esc(n.stage)+'</small><strong>'+esc(n.title)+'</strong><p>'+esc(n.subtitle)+'</p><em>'+esc(n.level)+' · 查看详解</em></button>'+(i<nodes.length-1?'<span class="arrow">→</span>':'')).join('')+'</div>';root.appendChild(art)});if(!total)root.innerHTML='<div class="empty">没有匹配的节点，请更换关键词。</div>';document.querySelectorAll('.node').forEach(b=>b.onclick=()=>openTopic(b.dataset.id))}

function renderModels(){document.querySelector('#modelGrid').innerHTML=DATA.models.map((m,i)=>'<button class="model" data-model="'+m.id+'" style="--model:'+m.accent+'"><small>MODEL / 0'+(i+1)+' · '+esc(m.category)+'</small><h2>'+esc(m.name)+'</h2><p>'+esc(m.subtitle)+'</p><dl><div><dt>发布时间</dt><dd>'+esc(m.releaseDate)+'</dd></div><div><dt>公司 / 机构</dt><dd>'+esc(m.organization)+'</dd></div><div><dt>规模</dt><dd>'+esc(m.parameters)+'</dd></div></dl><p>'+esc(m.summary)+'</p><em>查看完整技术档案 →</em></button>').join('');document.querySelectorAll('.model').forEach(b=>b.onclick=()=>openModelWithDiagram(b.dataset.model))}

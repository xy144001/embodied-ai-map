<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1130" role="img" aria-labelledby="title desc">
<title id="title">Joint：让动作后两层配合 memory 学习</title><desc id="desc">离线训练图。原 WAM 参数仍冻结；有效动作变换因新增 LoRA 而改变。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#97b8ee"/></marker></defs>
<rect width="1100" height="1130" rx="12" fill="#091522"/>
<g font-family="system-ui, Noto Sans SC, Microsoft YaHei, sans-serif">
<text x="36" y="43" font-size="27" font-weight="700" fill="#f0f5ff">Joint：让动作后两层配合 memory 学习</text>
<text x="36" y="76" font-size="17" fill="#a9bdd9">离线训练图。原 WAM 参数仍冻结；有效动作变换因新增 LoRA 而改变。</text>

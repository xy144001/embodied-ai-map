<path d="M 510,456 L 620,448" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 275,497 L 275,533.5 L 275,533.5 L 275,570" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 840,501 L 840,605 L 510,605" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 275,645 L 275,677.5 L 275,677.5 L 275,710" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>

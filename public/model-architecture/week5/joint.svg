<path d="M 840,792 L 840,828.5 L 840,828.5 L 840,865" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<g data-node="prefix"><rect x="40" y="115" width="470" height="94" rx="8" fill="#14253a" stroke="#577ba8" stroke-width="1.5"/>
<text x="275" y="145.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">冻结文本／视频与动作 blocks 0–27</text>
<text x="275" y="171.5" text-anchor="middle" font-size="17" fill="#bdd0e9">缓存边界移到 block27 后</text>
<text x="275" y="195.5" text-anchor="middle" font-size="17" fill="#bdd0e9">hidden27：[1,32,1024]</text>
</g>
<g data-node="context"><rect x="620" y="115" width="440" height="94" rx="8" fill="#14253a" stroke="#577ba8" stroke-width="1.5"/>
<text x="840" y="145.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">冻结条件与候选准入</text>
<text x="840" y="171.5" text-anchor="middle" font-size="17" fill="#bdd0e9">语言／视频 K/V／当前首帧／状态</text>
<text x="840" y="195.5" text-anchor="middle" font-size="17" fill="#bdd0e9">原 bank → hard → 冻结 M6</text>
</g>
<g data-node="b28"><rect x="40" y="270" width="470" height="82" rx="8" fill="#12342f" stroke="#67bda4" stroke-width="1.5"/>
<text x="275" y="306.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">动作 block28 ＋ rank8 LoRA</text>
<text x="275" y="332.5" text-anchor="middle" font-size="17" fill="#bdd0e9">原参数冻结；只训练新增 LoRA</text>
</g>
<g data-node="m7"><rect x="620" y="395" width="440" height="106" rx="8" fill="#12342f" stroke="#67bda4" stroke-width="1.5"/>
<text x="840" y="419.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">完整 Relation M7 继续训练</text>
<text x="840" y="445.5" text-anchor="middle" font-size="17" fill="#bdd0e9">h ＋ context ＋ K 个候选</text>
<text x="840" y="469.5" text-anchor="middle" font-size="17" fill="#bdd0e9">完整 residual 仍 Mean-Utility</text>
<text x="840" y="493.5" text-anchor="middle" font-size="17" fill="#bdd0e9">不叠加 Candidate-Attention</text>
</g>
<g data-node="h"><rect x="40" y="415" width="470" height="82" rx="8" fill="#152437" stroke="#647a97" stroke-width="1.5"/>
<text x="275" y="451.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">block28 输出 h</text>
<text x="275" y="477.5" text-anchor="middle" font-size="17" fill="#bdd0e9">[1,32,1024]</text>
</g>
<g data-node="add"><rect x="40" y="570" width="470" height="75" rx="8" fill="#292442" stroke="#a398df" stroke-width="1.5"/>
<text x="275" y="615" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">h ＋ Δ_mean</text>
</g>
<g data-node="b29"><rect x="40" y="710" width="470" height="82" rx="8" fill="#12342f" stroke="#67bda4" stroke-width="1.5"/>
<text x="275" y="746.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">动作 block29 ＋ rank8 LoRA</text>
<text x="275" y="772.5" text-anchor="middle" font-size="17" fill="#bdd0e9">原后缀处理保持</text>
</g>
<g data-node="head"><rect x="620" y="710" width="440" height="82" rx="8" fill="#12342f" stroke="#67bda4" stroke-width="1.5"/>
<text x="840" y="746.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">输出 head ＋ rank8 LoRA</text>
<text x="840" y="772.5" text-anchor="middle" font-size="17" fill="#bdd0e9">预测 [1,32,14]</text>
</g>
<g data-node="loss"><rect x="620" y="865" width="440" height="95" rx="8" fill="#33291c" stroke="#b69559" stroke-width="1.5"/>
<text x="840" y="896" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">成功轨迹动作去噪 MSE</text>
<text x="840" y="922" text-anchor="middle" font-size="17" fill="#bdd0e9">梯度回到 LoRA 与完整 M7</text>
<text x="840" y="946" text-anchor="middle" font-size="17" fill="#bdd0e9">原采样器负责后续去噪／动作生成</text>
</g>
<text x="40" y="875" font-size="17" fill="#a7bddb">LoRA：499,824 参数</text>
<text x="40" y="910" font-size="17" fill="#a7bddb">Relation M7：1,626,957 参数</text>
<text x="40" y="1015" font-size="17" fill="#a7bddb">M7-only：只续训 M7；LoRA-only：不使用 M7；Joint：两者一起训练。</text>
<text x="40" y="1051" font-size="17" fill="#a7bddb">Joint-off：关闭同一 Joint 的 memory；它与另训的 LoRA-only 不是同一套权重。</text>
<text x="40" y="1087" font-size="17" fill="#a7bddb">为突出可训练位置，省略原文本／视频条件到动作 blocks 的连线；这些原条件继续保留。</text>
</g></svg>

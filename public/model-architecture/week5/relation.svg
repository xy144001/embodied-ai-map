<g data-node="state"><rect x="40" y="110" width="300" height="78" rx="8" fill="#33291c" stroke="#b69559" stroke-width="1.5"/>
<text x="190" y="144.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">当前 state</text>
<text x="190" y="170.5" text-anchor="middle" font-size="17" fill="#bdd0e9">[1,38] · GT 几何辅助</text>
</g>
<g data-node="lang"><rect x="400" y="110" width="300" height="78" rx="8" fill="#14253a" stroke="#577ba8" stroke-width="1.5"/>
<text x="550" y="144.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">有效文本 tokens</text>
<text x="550" y="170.5" text-anchor="middle" font-size="17" fill="#bdd0e9">[1,L,4096] · 冻结编码</text>
</g>
<g data-node="obs"><rect x="760" y="110" width="300" height="78" rx="8" fill="#14253a" stroke="#577ba8" stroke-width="1.5"/>
<text x="910" y="144.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">当前首帧图像 tokens</text>
<text x="910" y="170.5" text-anchor="middle" font-size="17" fill="#bdd0e9">[1,16,3072] · 4×4 池化</text>
</g>
<g data-node="ctx"><rect x="350" y="235" width="400" height="88" rx="8" fill="#12342f" stroke="#67bda4" stroke-width="1.5"/>
<text x="550" y="262.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">多模态关系 context</text>
<text x="550" y="288.5" text-anchor="middle" font-size="17" fill="#bdd0e9">投影到 128 维；self-attention＋FFN</text>
<text x="550" y="312.5" text-anchor="middle" font-size="17" fill="#bdd0e9">1 状态＋L 文本＋16 图像 tokens</text>
</g>
<g data-node="h"><rect x="40" y="370" width="260" height="90" rx="8" fill="#14253a" stroke="#577ba8" stroke-width="1.5"/>
<text x="170" y="398.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">动作 hidden h</text>
<text x="170" y="424.5" text-anchor="middle" font-size="17" fill="#bdd0e9">block28 后 [1,32,1024]</text>
<text x="170" y="448.5" text-anchor="middle" font-size="17" fill="#bdd0e9">＋位置／去噪时刻</text>
</g>
<g data-node="q"><rect x="350" y="370" width="400" height="90" rx="8" fill="#12342f" stroke="#67bda4" stroke-width="1.5"/>
<text x="550" y="398.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">动作位置自己的 query q</text>
<text x="550" y="424.5" text-anchor="middle" font-size="17" fill="#bdd0e9">hidden 对 context 做 cross-attention</text>
<text x="550" y="448.5" text-anchor="middle" font-size="17" fill="#bdd0e9">[1,32,128]</text>
</g>
<g data-node="m"><rect x="790" y="495" width="270" height="90" rx="8" fill="#33291c" stroke="#b69559" stroke-width="1.5"/>
<text x="925" y="523.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">历史片段 mᵢ</text>
<text x="925" y="549.5" text-anchor="middle" font-size="17" fill="#bdd0e9">16×91 → memory encoder</text>
<text x="925" y="573.5" text-anchor="middle" font-size="17" fill="#bdd0e9">仅已执行状态与动作</text>
</g>
<g data-node="read"><rect x="350" y="495" width="400" height="90" rx="8" fill="#12342f" stroke="#67bda4" stroke-width="1.5"/>
<text x="550" y="523.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">q 读取该片段的 tokens</text>
<text x="550" y="549.5" text-anchor="middle" font-size="17" fill="#bdd0e9">memory cross-attention → rᵢ</text>
<text x="550" y="573.5" text-anchor="middle" font-size="17" fill="#bdd0e9">[1,32,128]</text>
</g>
<g data-node="f"><rect x="40" y="635" width="470" height="68" rx="8" fill="#12342f" stroke="#67bda4" stroke-width="1.5"/>
<text x="275" y="664.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">fᵢ = concat(q, rᵢ)</text>
<text x="275" y="690.5" text-anchor="middle" font-size="17" fill="#bdd0e9">256 维输出特征</text>
</g>
<g data-node="z"><rect x="590" y="635" width="470" height="68" rx="8" fill="#12342f" stroke="#67bda4" stroke-width="1.5"/>
<text x="825" y="664.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">zᵢ = concat(q, rᵢ, q×rᵢ, |q−rᵢ|)</text>
<text x="825" y="690.5" text-anchor="middle" font-size="17" fill="#bdd0e9">512 维关系特征</text>
</g>
<g data-node="out"><rect x="40" y="745" width="470" height="78" rx="8" fill="#12342f" stroke="#67bda4" stroke-width="1.5"/>
<text x="275" y="779.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">residual 输出网络</text>
<text x="275" y="805.5" text-anchor="middle" font-size="17" fill="#bdd0e9">256 → 128 → 1024</text>
</g>
<g data-node="g"><rect x="590" y="745" width="470" height="78" rx="8" fill="#12342f" stroke="#67bda4" stroke-width="1.5"/>
<text x="825" y="779.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">关系系数 gᵢ = sigmoid(·)</text>
<text x="825" y="805.5" text-anchor="middle" font-size="17" fill="#bdd0e9">[1,32,1] · 每动作位置一个数</text>
</g>
<g data-node="single"><rect x="220" y="875" width="660" height="74" rx="8" fill="#292442" stroke="#a398df" stroke-width="1.5"/>
<text x="550" y="907.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">形成完整单条增量 Δᵢ = FP32(hᵢ) − FP32(h)</text>
<text x="550" y="933.5" text-anchor="middle" font-size="17" fill="#bdd0e9">hᵢ = h ＋ cast(gᵢ × residual)；保留 dtype 舍入</text>
</g>
<g data-node="mean"><rect x="220" y="995" width="660" height="62" rx="8" fill="#292442" stroke="#a398df" stroke-width="1.5"/>
<text x="550" y="1033.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">候选完整 Δᵢ 等权平均，加回同一个 h</text>
</g>
</g></svg>

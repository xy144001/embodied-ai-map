<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 935" role="img" aria-labelledby="title desc">
<title id="title">候选 Attention：给完整修正建议分配比例</title><desc id="desc">离线训练：只更新两个无 bias 的 128→64 投影，共 16,384 参数。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#97b8ee"/></marker></defs>
<rect width="1100" height="935" rx="12" fill="#091522"/>
<g font-family="system-ui, Noto Sans SC, Microsoft YaHei, sans-serif">
<text x="36" y="43" font-size="27" font-weight="700" fill="#f0f5ff">候选 Attention：给完整修正建议分配比例</text>
<text x="36" y="76" font-size="17" fill="#a9bdd9">离线训练：只更新两个无 bias 的 128→64 投影，共 16,384 参数。</text>
<path d="M 550,205 L 550,242.5 L 190,242.5 L 190,280" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 550,205 L 550,242.5 L 550,242.5 L 550,280" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 550,205 L 550,242.5 L 910,242.5 L 910,280" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 190,360 L 190,397.5 L 190,397.5 L 190,435" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 550,360 L 550,397.5 L 550,397.5 L 550,435" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 190,505 L 190,540 L 370,540 L 370,575" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 550,505 L 550,540 L 370,540 L 370,575" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 370,675 L 370,710 L 550,710 L 550,745" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 910,360 L 910,710 L 550,710 L 550,745" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<g data-node="source"><rect x="160" y="115" width="780" height="90" rx="8" fill="#14253a" stroke="#577ba8" stroke-width="1.5"/>
<text x="550" y="155.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">冻结完整 Relation：K 个候选各走原 single_output</text>
<text x="550" y="181.5" text-anchor="middle" font-size="17" fill="#bdd0e9">同一个 h、context、时刻和噪声 → q、rᵢ、完整 Δᵢ</text>
</g>
<g data-node="q"><rect x="40" y="280" width="300" height="80" rx="8" fill="#14253a" stroke="#577ba8" stroke-width="1.5"/>
<text x="190" y="315.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">动作 query q</text>
<text x="190" y="341.5" text-anchor="middle" font-size="17" fill="#bdd0e9">[1,32,128]</text>
</g>
<g data-node="r"><rect x="400" y="280" width="300" height="80" rx="8" fill="#14253a" stroke="#577ba8" stroke-width="1.5"/>
<text x="550" y="315.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">候选召回 rᵢ</text>
<text x="550" y="341.5" text-anchor="middle" font-size="17" fill="#bdd0e9">[K,1,32,128]</text>
</g>
<g data-node="d"><rect x="760" y="280" width="300" height="80" rx="8" fill="#14253a" stroke="#577ba8" stroke-width="1.5"/>
<text x="910" y="303.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">完整最终 Δᵢ</text>
<text x="910" y="329.5" text-anchor="middle" font-size="17" fill="#bdd0e9">[K,1,32,1024]</text>
<text x="910" y="353.5" text-anchor="middle" font-size="17" fill="#bdd0e9">含原关系系数 gᵢ</text>
</g>
<g data-node="wq"><rect x="40" y="435" width="300" height="70" rx="8" fill="#12342f" stroke="#67bda4" stroke-width="1.5"/>
<text x="190" y="477.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">训练 Wq：128 → 64</text>
</g>
<g data-node="wk"><rect x="400" y="435" width="300" height="70" rx="8" fill="#12342f" stroke="#67bda4" stroke-width="1.5"/>
<text x="550" y="477.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">训练 Wk：128 → 64</text>
</g>
<g data-node="softmax"><rect x="40" y="575" width="660" height="100" rx="8" fill="#12342f" stroke="#67bda4" stroke-width="1.5"/>
<text x="370" y="608.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">scoreᵢ = Wq(q) · Wk(rᵢ) / √64</text>
<text x="370" y="634.5" text-anchor="middle" font-size="17" fill="#bdd0e9">沿候选维 softmax → wᵢ [K,1,32,1]</text>
<text x="370" y="658.5" text-anchor="middle" font-size="17" fill="#bdd0e9">每动作位置、每去噪步分别加权</text>
</g>
<g data-node="sum"><rect x="160" y="745" width="780" height="90" rx="8" fill="#292442" stroke="#a398df" stroke-width="1.5"/>
<text x="550" y="785.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">Δ = Σ wᵢ Δᵢ；只加回一次 h</text>
<text x="550" y="811.5" text-anchor="middle" font-size="17" fill="#bdd0e9">继续冻结动作后缀；没有 Hybrid 专家，也不使用 utility 加权</text>
</g>
<text x="40" y="880" font-size="17" fill="#a7bddb">起点严格等价 Mean；候选重排不变 ≠ episode 历史顺序不敏感。</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1070" role="img" aria-labelledby="title desc">
<title id="title">多任务通路：共享参数，经历仍按类别隔离</title><desc id="desc">绿色为本轮联合训练的 M7；蓝色为冻结模块；紫色为本轮变化的输出通路。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#97b8ee"/></marker></defs>
<rect width="1100" height="1070" rx="12" fill="#091522"/>
<g font-family="system-ui, Noto Sans SC, Microsoft YaHei, sans-serif">
<text x="36" y="43" font-size="27" font-weight="700" fill="#f0f5ff">多任务通路：共享参数，经历仍按类别隔离</text>
<text x="36" y="76" font-size="17" fill="#a9bdd9">绿色为本轮联合训练的 M7；蓝色为冻结模块；紫色为本轮变化的输出通路。</text>
<path d="M 360,164 L 420,164" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 200,208 L 200,239 L 550,239 L 550,270" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 740,208 L 740,239 L 550,239 L 550,270" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 550,370 L 550,405 L 200,405 L 200,440" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 550,370 L 550,405 L 565,405 L 565,440" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 550,370 L 550,405 L 910,405 L 910,440" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 710,495 L 760,495" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 200,550 L 200,587.5 L 550,587.5 L 550,625" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 910,550 L 910,587.5 L 550,587.5 L 550,625" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 550,715 L 550,745 L 550,745 L 550,775" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<g data-node="class"><rect x="40" y="120" width="320" height="88" rx="8" fill="#14253a" stroke="#577ba8" stroke-width="1.5"/>
<text x="200" y="159.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">语言 → 冻结分类器</text>
<text x="200" y="185.5" text-anchor="middle" font-size="17" fill="#bdd0e9">预测类别 c；不读真实任务答案</text>
</g>
<g data-node="bank"><rect x="420" y="120" width="640" height="88" rx="8" fill="#33291c" stroke="#b69559" stroke-width="1.5"/>
<text x="740" y="159.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">只取类别 c 的成功历史 → hard → 原 M6</text>
<text x="740" y="185.5" text-anchor="middle" font-size="17" fill="#bdd0e9">K 个合格片段；共享专家不是 memory 条目</text>
</g>
<g data-node="enc"><rect x="40" y="270" width="1020" height="100" rx="8" fill="#12342f" stroke="#67bda4" stroke-width="1.5"/>
<text x="550" y="303.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">联合训练的共享关系编码器</text>
<text x="550" y="329.5" text-anchor="middle" font-size="17" fill="#bdd0e9">h / state / language / 当前首帧 / time → query ＋类别 c 的 embedding</text>
<text x="550" y="353.5" text-anchor="middle" font-size="17" fill="#bdd0e9">逐候选读 memory → fᵢ = 256 维；zᵢ = 512 维</text>
</g>
<g data-node="private"><rect x="40" y="440" width="320" height="110" rx="8" fill="#292442" stroke="#a398df" stroke-width="1.5"/>
<text x="200" y="478.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">当前类别专属输出</text>
<text x="200" y="504.5" text-anchor="middle" font-size="17" fill="#bdd0e9">Private_c(fᵢ)</text>
<text x="200" y="528.5" text-anchor="middle" font-size="17" fill="#bdd0e9">256 → r_private → 1024</text>
</g>
<g data-node="router"><rect x="420" y="440" width="290" height="110" rx="8" fill="#12342f" stroke="#67bda4" stroke-width="1.5"/>
<text x="565" y="478.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">共享专家 router</text>
<text x="565" y="504.5" text-anchor="middle" font-size="17" fill="#bdd0e9">zᵢ → 4 个分数</text>
<text x="565" y="528.5" text-anchor="middle" font-size="17" fill="#bdd0e9">逐候选／动作位置选 Top-2</text>
</g>
<g data-node="experts"><rect x="760" y="440" width="300" height="110" rx="8" fill="#292442" stroke="#a398df" stroke-width="1.5"/>
<text x="910" y="478.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">4 个共享输出专家</text>
<text x="910" y="504.5" text-anchor="middle" font-size="17" fill="#bdd0e9">只计算选中动作行</text>
<text x="910" y="528.5" text-anchor="middle" font-size="17" fill="#bdd0e9">256 → r_shared → 1024</text>
</g>
<g data-node="sum"><rect x="40" y="625" width="1020" height="90" rx="8" fill="#292442" stroke="#a398df" stroke-width="1.5"/>
<text x="550" y="665.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">专属输出 ＋ 被选共享输出的归一加权和</text>
<text x="550" y="691.5" text-anchor="middle" font-size="17" fill="#bdd0e9">乘原关系系数 gᵢ → 完整 Δᵢ → 候选间仍均匀 Mean</text>
</g>
<g data-node="configs"><rect x="40" y="775" width="1020" height="195" rx="8" fill="#152437" stroke="#647a97" stroke-width="1.5"/>
<text x="550" y="832" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">保持激活瓶颈宽度 32；总参数量与计算量并未完全匹配</text>
<text x="550" y="858" text-anchor="middle" font-size="17" fill="#bdd0e9">Private：32 ＋ 0          Hybrid：16 ＋ 2×8</text>
<text x="550" y="882" text-anchor="middle" font-size="17" fill="#bdd0e9">Shared-Small：8 ＋ 2×12          Shared：0 ＋ 2×16</text>
<text x="550" y="906" text-anchor="middle" font-size="17" fill="#bdd0e9">rank 是带 SiLU 的中间宽度，不是固定线性矩阵的秩</text>
<text x="550" y="930" text-anchor="middle" font-size="17" fill="#bdd0e9">Shared 仍保留每类 embedding、旧 M6 与同类 bank</text>
</g>
<text x="40" y="1027" font-size="17" fill="#a7bddb">每方法、每合集只有一个共享 M7 实例；5 类与 10 类网络分别从零输出开始训练。</text>
</g></svg>

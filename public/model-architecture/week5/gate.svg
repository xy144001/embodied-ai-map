<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1090" role="img" aria-labelledby="title desc">
<title id="title">最新 Gate：缩放已经聚合好的整块增量</title><desc id="desc">离线训练仅更新新 DecisionGate；Joint 的 WAM、LoRA、M7、M6 全部冻结。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#97b8ee"/></marker></defs>
<rect width="1100" height="1090" rx="12" fill="#091522"/>
<g font-family="system-ui, Noto Sans SC, Microsoft YaHei, sans-serif">
<text x="36" y="43" font-size="27" font-weight="700" fill="#f0f5ff">最新 Gate：缩放已经聚合好的整块增量</text>
<text x="36" y="76" font-size="17" fill="#a9bdd9">离线训练仅更新新 DecisionGate；Joint 的 WAM、LoRA、M7、M6 全部冻结。</text>
<path d="M 470,160 L 610,160" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 255,205 L 255,240 L 255,240 L 255,275" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 835,205 L 835,240 L 255,240 L 255,275" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 835,205 L 835,240 L 835,240 L 835,275" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 255,360 L 255,392.5 L 255,392.5 L 255,425" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 835,360 L 835,392.5 L 835,392.5 L 835,425" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 470,480 L 610,480" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 835,535 L 835,570 L 835,570 L 835,605" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 835,710 L 835,750 L 550,750 L 550,790" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 40,317 L 20,317 L 20,835 L 40,835" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 255,115 L 255,98 L 1080,98 L 1080,855 L 1060,855" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 550,880 L 550,917.5 L 550,917.5 L 550,955" fill="none" stroke="#97b8ee" stroke-width="2" marker-end="url(#arrow)"/>
<g data-node="h"><rect x="40" y="115" width="430" height="90" rx="8" fill="#14253a" stroke="#577ba8" stroke-width="1.5"/>
<text x="255" y="143.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">固定 Joint → block28 后 h</text>
<text x="255" y="169.5" text-anchor="middle" font-size="17" fill="#bdd0e9">[1,32,1024]</text>
<text x="255" y="193.5" text-anchor="middle" font-size="17" fill="#bdd0e9">含已训练后冻结的 LoRA</text>
</g>
<g data-node="rel"><rect x="610" y="115" width="450" height="90" rx="8" fill="#14253a" stroke="#577ba8" stroke-width="1.5"/>
<text x="835" y="143.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">冻结 Relation ＋原 M6 准入</text>
<text x="835" y="169.5" text-anchor="middle" font-size="17" fill="#bdd0e9">所有合格候选 → 原 Mean 输出 h_mean</text>
<text x="835" y="193.5" text-anchor="middle" font-size="17" fill="#bdd0e9">仍使用原当前多模态 context</text>
</g>
<g data-node="delta"><rect x="40" y="275" width="430" height="85" rx="8" fill="#14253a" stroke="#577ba8" stroke-width="1.5"/>
<text x="255" y="313" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">实际增量 Δ = FP32(h_mean) − FP32(h)</text>
<text x="255" y="339" text-anchor="middle" font-size="17" fill="#bdd0e9">取原 Mean 已完成 dtype 转换的输出</text>
</g>
<g data-node="q"><rect x="610" y="275" width="450" height="85" rx="8" fill="#14253a" stroke="#577ba8" stroke-width="1.5"/>
<text x="835" y="313" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">query q 沿动作位置平均</text>
<text x="835" y="339" text-anchor="middle" font-size="17" fill="#bdd0e9">[1,32,128] → [1,128]</text>
</g>
<g data-node="stats"><rect x="40" y="425" width="430" height="110" rx="8" fill="#152437" stroke="#647a97" stroke-width="1.5"/>
<text x="255" y="451.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">4 个数值统计</text>
<text x="255" y="477.5" text-anchor="middle" font-size="17" fill="#bdd0e9">Δ RMS、h RMS</text>
<text x="255" y="501.5" text-anchor="middle" font-size="17" fill="#bdd0e9">cos(Δ,h)、K/10</text>
<text x="255" y="525.5" text-anchor="middle" font-size="17" fill="#bdd0e9">K/10 只是缩放，不是候选上限</text>
</g>
<g data-node="features"><rect x="610" y="425" width="450" height="110" rx="8" fill="#14253a" stroke="#577ba8" stroke-width="1.5"/>
<text x="835" y="463.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">132 维 gate 输入 · detach</text>
<text x="835" y="489.5" text-anchor="middle" font-size="17" fill="#bdd0e9">128 维 query 摘要 ＋ 4 项统计</text>
<text x="835" y="513.5" text-anchor="middle" font-size="17" fill="#bdd0e9">无终局标签、seed 或未来观测</text>
</g>
<g data-node="gate"><rect x="610" y="605" width="450" height="105" rx="8" fill="#12342f" stroke="#67bda4" stroke-width="1.5"/>
<text x="835" y="641" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">唯一训练模块：DecisionGate</text>
<text x="835" y="667" text-anchor="middle" font-size="17" fill="#bdd0e9">LayerNorm132 → Linear64 → SiLU</text>
<text x="835" y="691" text-anchor="middle" font-size="17" fill="#bdd0e9">Linear1 → sigmoid；8,841 参数</text>
</g>
<g data-node="apply"><rect x="40" y="790" width="1020" height="90" rx="8" fill="#292442" stroke="#a398df" stroke-width="1.5"/>
<text x="550" y="830.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">h_out = cast(FP32(h) ＋ g × Δ)</text>
<text x="550" y="856.5" text-anchor="middle" font-size="17" fill="#bdd0e9">每次去噪调用一个 g；统一缩放 [1,32,1024] 的整块增量</text>
</g>
<g data-node="tail"><rect x="220" y="955" width="660" height="72" rx="8" fill="#14253a" stroke="#577ba8" stroke-width="1.5"/>
<text x="550" y="986.5" text-anchor="middle" font-size="20" font-weight="650" fill="#edf4ff">冻结 Joint 后缀 → 原去噪更新与动作执行</text>
<text x="550" y="1012.5" text-anchor="middle" font-size="17" fill="#bdd0e9">含已训练后冻结的 block29 / head LoRA</text>
</g>
<text x="40" y="680" font-size="17" fill="#a7bddb">初始 g=0.5；范围 0–1。</text>
<text x="40" y="717" font-size="17" fill="#a7bddb">只缩小，不翻向、不放大、不重选候选。</text>
</g></svg>
